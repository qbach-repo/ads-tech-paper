name: Discover ads-tech papers

on:
  schedule:
    # Every Monday at 13:00 UTC.
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days back to search for newly-submitted papers'
        required: false
        default: '10'

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Search arXiv for new candidate papers
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '10' }}
        run: python scripts/discover_papers.py

      - name: File a triage issue per new candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_candidate_issues.py

      - name: Commit updated seen-paper tracking file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discovery/seen_ids.json
          git diff --cached --quiet || git commit -m "Record papers surfaced by discovery run [skip ci]"
          git push
